[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "redteam-ai"
version = "1.0.0"
description = "REDTEAM AI - Groq, SQLite, pesquisa web e XEXPLOIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "requests>=2.32,<3.0",
    "beautifulsoup4>=4.12,<5.0",
    "pybit>=5.0,<6.0"
]

[tool.setuptools]
package-dir = {"" = "app/src/main/python"}

[tool.setuptools.packages.find]
where = ["app/src/main/python"]
namespaces = true
